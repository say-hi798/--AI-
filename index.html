<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国近现代史纲要 · 考前60分主观题带背</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B4301E'/%3E%3Cpath d='M16 6l2.2 4.5L23 11l-3.6 3.1.9 4.9L16 17l-4.3 3 .9-4.9L9 11l4.8-.5z' fill='%23F5F1E7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#242019; --ink-soft:#3a352c;
    --paper:#F6F2E8; --card:#FDFBF4;
    --vermilion:#B4301E; --vermilion-soft:#7a2a1d;
    --gold:#B0832F; --gold-soft:#c7a054;
    --line:#D4CBB4; --line-strong:#BDB29A;
    --muted:#6E6658;
    --shadow:0 8px 24px rgba(60,50,30,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); line-height:1.75; font-size:18px;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(176,131,47,.10), transparent 60%),
      radial-gradient(1000px 500px at 5% 5%, rgba(180,48,30,.06), transparent 60%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .serif{font-family:"Noto Serif SC",serif}
  .hl{color:var(--vermilion);font-weight:700}
  .kword{display:inline-block;background:rgba(180,48,30,.09);color:var(--vermilion-soft);font-weight:700;border-radius:6px;padding:0 6px}

  /* ===== 顶部导航 ===== */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(246,242,232,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar .inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
  .brand{font-weight:900;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:9px}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:var(--vermilion);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .navtabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
  .navtabs::-webkit-scrollbar{display:none}
  .navtabs button{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:100px;padding:5px 13px;font-size:13px;white-space:nowrap;cursor:pointer;
    font-family:inherit;transition:all .16s;
  }
  .navtabs button:hover{color:var(--vermilion-soft);border-color:var(--vermilion)}
  .navtabs button.active{background:var(--vermilion);color:#fff;border-color:var(--vermilion)}
  .navtabs button.homebtn{font-weight:700}

  /* ===== 视图容器 ===== */
  .view{display:none;max-width:1280px;margin:0 auto;padding:34px 20px 60px}
  .view.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== 首页 ===== */
  .home-hero{text-align:center;padding:30px 0 10px}
  .home-hero .eyebrow{display:inline-block;letter-spacing:.38em;font-size:12.5px;color:var(--vermilion-soft);border:1px solid var(--line-strong);padding:5px 16px;border-radius:100px;background:rgba(255,255,255,.4)}
  .home-hero h1{font-size:clamp(28px,4.6vw,44px);font-weight:900;margin-top:16px;letter-spacing:.03em}
  .home-hero p{color:var(--muted);margin-top:10px;font-size:15px}
  .home-hero .stats{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:24px}
  .home-hero .stats .s b{display:block;font-size:28px;color:var(--vermilion);font-weight:900}
  .home-hero .stats .s span{font-size:13px;color:var(--muted)}

  .section-title{display:flex;align-items:center;gap:12px;margin:42px 0 20px}
  .section-title .bar{width:5px;height:24px;background:var(--vermilion);border-radius:3px}
  .section-title h2{font-size:21px;font-weight:800}
  .section-title .hint{font-size:13px;color:var(--muted)}

  /* 总览时间线 */
  .ov-rail-wrap{position:relative;padding-left:8px}
  .ov-row{display:grid;grid-template-columns:150px 46px 1fr;align-items:center;margin-bottom:18px;cursor:pointer}
  .ov-row .when{text-align:right;padding-right:16px;font-family:"Noto Serif SC",serif;font-weight:700;color:var(--vermilion-soft);font-size:14px}
  .ov-row .dotcol{position:relative;display:flex;justify-content:center}
  .ov-rail-wrap::before{content:"";position:absolute;left:calc(150px + 23px);top:14px;bottom:14px;width:2px;background:var(--line-strong)}
  .ov-row .dotcol .d{width:18px;height:18px;border-radius:50%;background:var(--vermilion);border:4px solid var(--paper);box-shadow:0 0 0 2px var(--vermilion);z-index:2}
  .ov-row .ov-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 18px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}
  .ov-row:hover .ov-card{transform:translateX(4px);box-shadow:0 12px 28px rgba(60,50,30,.15)}
  .ov-row .ov-card .t{font-weight:700;font-size:17.5px}
  .ov-row .ov-card .t .n{color:var(--vermilion);margin-right:8px}
  .ov-row .ov-card .d2{font-size:14.5px;color:var(--muted);margin-top:3px}
  .ov-row .ov-card .tags{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:100px;padding:1px 9px;color:var(--muted);background:#fffdf8}

  /* ===== 章节页 ===== */
  .ch-head{border:1px solid var(--line);border-radius:16px;padding:26px 28px;background:linear-gradient(135deg,#fffdf8, #f3ecdb);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .ch-head .big{position:absolute;right:18px;top:-14px;font-size:110px;font-weight:900;color:rgba(180,48,30,.08);line-height:1;font-family:"Noto Serif SC",serif}
  .ch-head .range{display:inline-block;background:var(--vermilion);color:#fff;font-size:13px;font-weight:700;padding:3px 13px;border-radius:8px}
  .ch-head h1{font-size:clamp(22px,3.4vw,31px);font-weight:900;margin-top:12px}
  .ch-head .lead{color:var(--muted);margin-top:8px;font-size:16px}

  .block-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .block-card .bh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .block-card .bh .bn{font-size:19px;font-weight:700}
  .stars{color:var(--gold);font-size:13px;letter-spacing:1px}
  .stars .dim{color:var(--line-strong)}
  .l{margin:6px 0;padding-left:17px;position:relative;font-size:16.5px;color:var(--ink-soft)}
  .l::before{content:"";position:absolute;left:3px;top:.7em;width:7px;height:7px;background:var(--gold-soft);border-radius:2px;transform:rotate(45deg)}

  /* 战争/事件小时间线 */
  .mini{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .mini .m{position:relative;padding:7px 0 7px 28px}
  .mini .m::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .mini .m::after{content:"";position:absolute;left:5px;top:1.25em;width:8px;height:8px;border-radius:50%;background:var(--vermilion);border:2px solid var(--card);box-sizing:border-box}
  .mini .m .when{display:inline-block;font-family:"Noto Serif SC",serif;font-weight:700;color:#fff;background:var(--vermilion);font-size:13.5px;padding:1px 9px;border-radius:6px}
  .mini .m .mn{font-weight:700;font-size:16px;margin-left:7px}
  .mini .m .md{font-size:15px;color:var(--muted);margin-top:3px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .subbox{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fffdf8}
  .subbox .t{font-weight:700;color:var(--vermilion-soft);font-size:15.5px;margin-bottom:5px}
  .subbox p{font-size:15px;color:var(--ink-soft)}

  /* 主观题 */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .filterbar .fl-lbl{font-size:13px;color:var(--muted);margin-right:2px}
  .filterbar button{border:1px solid var(--line);background:var(--card);border-radius:100px;padding:6px 15px;font-size:14.5px;cursor:pointer;font-family:inherit;color:var(--muted);transition:all .15s}
  .filterbar button.active{background:var(--vermilion);color:#fff;border-color:var(--vermilion)}
  .filterbar button .cnt{opacity:.75;font-size:12.5px;margin-left:3px}

  .qa{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .qa .q{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;cursor:pointer;user-select:none}
  .qa .q:hover{background:#faf6ec}
  .qa .q .lv{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:6px;margin-top:2px;white-space:nowrap}
  .lv.jg{background:rgba(180,48,30,.14);color:var(--vermilion)}
  .lv.gp{background:rgba(176,131,47,.18);color:var(--gold)}
  .lv.zp{background:#e9e4d6;color:var(--muted)}
  .qa .q .qt{flex:1;font-size:17px;font-weight:700}
  .qa .q .qt .ty{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
  .qa .q .ar{flex:0 0 auto;color:var(--muted);font-size:18px;transition:transform .2s;margin-top:-2px}
  .qa.open .q .ar{transform:rotate(45deg)}
  .qa .a{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .qa.open .a{max-height:1400px}
  .qa .a .ain{padding:4px 18px 16px 18px;border-top:1px dashed var(--line)}
  .qa .a .ap{font-size:16px;color:var(--ink-soft);margin:9px 0;padding-left:32px;position:relative}
  .qa .a .ap .pn{position:absolute;left:0;top:0;color:var(--vermilion);font-weight:700;padding-right:4px}
  .qa .a .ap.sub{padding-left:52px}
  .qa .a .ap.sub .pn{left:18px}

  /* 章节翻页 */
  .chpager{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
  .chpager a{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 18px;box-shadow:var(--shadow);transition:transform .15s;max-width:48%}
  .chpager a:hover{transform:translateY(-2px)}
  .chpager a.next{text-align:right}
  .chpager a .k{font-size:12px;color:var(--muted)}
  .chpager a .v{font-weight:700;font-size:14.5px}
  .chpager a.disabled{visibility:hidden}

  /* 年表 */
  .era-group{margin-bottom:26px}
  .era-group .era-t{display:inline-block;background:var(--ink);color:#f3ecdb;font-size:14px;font-weight:700;padding:4px 16px;border-radius:8px;margin-bottom:12px}
  table.tl-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  table.tl-table th,table.tl-table td{border:1px solid var(--line);padding:10px 15px;font-size:15.5px;text-align:left}
  table.tl-table th{background:#efe8d8;font-weight:700}
  table.tl-table td.year{width:150px;font-family:"Noto Serif SC",serif;font-weight:700;color:var(--vermilion-soft);white-space:nowrap}

  footer{text-align:center;padding:30px 20px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}

  /* ===== 响应式 ===== */
  @media (max-width:820px){
    .grid2{grid-template-columns:1fr}
    .ov-row{grid-template-columns:96px 38px 1fr}
    .ov-rail-wrap::before{left:calc(96px + 19px)}
    .ov-row .when{font-size:12.5px;padding-right:10px}
    .chpager a .v{font-size:13px}
  }
  @media (max-width:560px){
    .view{padding:24px 13px 50px}
    .topbar .inner{padding:9px 12px}
    .brand .btxt{display:none}
    table.tl-table td.year{width:96px;font-size:12.5px}
    table.tl-table th,table.tl-table td{padding:7px 9px;font-size:13px}
  }
</style>
</head>

  {lv:'jg',ty:'论述题',q:'近代中国社会的半殖民地半封建性质',a:[
   '<b>半殖民地的原因：</b>①在西方列强侵略下，中国已丧失完全独立的地位（领土、主权都不完整）；②中国名义上还是独立国家，有自己的政府，因此被称作半殖民地。',
   '<b>半封建的原因：</b>①中国出现了资本主义生产关系，已经不是完全的封建社会了；②中国的民族资本主义经济并没有也不可能成为中国社会经济的主要形式。']},
  {lv:'jg',ty:'论述题',q:'19世纪末帝国主义列强瓜分中国的图谋未能实现的原因',a:[
   '帝国主义列强之间的矛盾和相互制约，是一个重要原因。',
   '中国长期以来一直是一个统一的大国。',
   '中国人民进行了不屈不挠的反侵略斗争。']},
  {lv:'jg',ty:'论述题',q:'试述近代中国半殖民地半封建社会的主要特点',a:[
   '资本—帝国主义不但操纵了中国的财政和经济命脉，而且控制了中国的政治，日益成为支配中国的决定性力量。',
   '中国的封建势力同外国侵略势力相勾结，成为外国列强压迫、奴役中国人民的社会基础和统治支柱。',
   '中国自然经济的基础虽然遭到破坏，但是封建剥削制度的根基依然在广大地区内保持着，成为中国走向现代化和民主化的严重障碍。',
   '中国资本主义有所发展，并在政治、文化生活中起了一定的作用，但始终没有成为中国社会经济的主体。',
   '中国各地区经济、政治和文化发展极不平衡，长期处于不统一状态。',
   '人民毫无政治权利，生活极端贫困化。']},
  {lv:'jg',ty:'论述题',q:'近代以来中华民族面临的两大历史任务及其相互关系',a:[
   '任务：①求得民族独立和人民解放；②实现国家繁荣富强和人民共同富裕。',
   '相互关系——区别：前者要推翻中国原统治秩序，解决生产关系问题；后者要改变近代中国落后的地位与状况，解决生产力问题。',
   '相互关系——联系：只有完成第一大任务，才能为第二大任务的完成创造条件；而完成第二大任务是完成第一大任务的最终目的。']},
  {lv:'jg',ty:'论述题',q:'近代中国社会的主要矛盾及其相互关系（口诀：近代中国两矛盾，国家仇恨总在变，外敌入侵国仇强，内外勾结主家恨）',a:[
   '帝国主义与中华民族的矛盾、封建主义与人民大众的矛盾，其中帝国主义与中华民族的矛盾是最主要的矛盾。',
   '外国列强发动侵略战争时，阶级矛盾降到次要地位，民族矛盾上升到主要地位；当外国侵略者同中国封建政权相勾结共同镇压中国革命，尤其是封建地主阶级对人民的压迫特别残酷时，阶级矛盾上升为主要矛盾。']},
  {lv:'gp',ty:'简答题',q:'中国封建社会的基本特点',a:[
   '经济：封建土地所有制占主导地位，小农经济是其基本生产结构。',
   '政治：实行高度中央集权的封建君主专制制度。',
   '文化：以儒家思想为核心。',
   '社会结构：族权和政权相结合的封建宗法等级制度。']},
  {lv:'zp',ty:'简答题',q:'近代中国工人阶级的特点（口诀：苦、少、穷）',a:[
   '深受帝国主义、封建势力和资产阶级三重压迫和剥削，革命性最强。',
   '人数虽少，但相对集中，便于形成革命力量和传播先进思想。',
   '主要由破产农民和家庭手工业者转化而来，同农民有着天然的联系，便于结成工农联盟。']},
  {lv:'zp',ty:'简答题',q:'近代中国民族资产阶级的特点是什么',a:[
   '受到外国资本主义和本国封建主义的压迫，在一定条件下可以参加反帝反封建的革命或在斗争中保持中立。',
   '力量薄弱，与外国资本主义和本国封建主义有联系，在斗争中缺乏彻底的革命性。']},
  {lv:'zp',ty:'简答题',q:'旧民主主义革命时期中国人民反侵略斗争失败的原因',a:[
   '社会制度腐败，是根本原因。清王朝维护自身统治，出卖国家和民族利益，实行“防民甚于防寇”的政策。',
   '经济技术落后，是重要原因。中国在武器装备、军队素质等方面远远落后于西方列强。']},
  {lv:'zp',ty:'简答题',q:'中日甲午战争后，严复提出的救亡思想的主要内容是什么',a:[
   '严复在《救亡决论》一文中提出了“救亡”的口号。',
   '严复翻译了《天演论》，提出“物竞天择”“适者生存”的社会进化论思想，激发人们的危机意识和民族意识。',
   '严复呼吁，中国如果不能自强，就会“弱者先绝”、亡国灭种，失去民族生存的权利。']},
  {lv:'zp',ty:'简答题',q:'简述近代中国工人阶级的产生',a:[
   '鸦片战争后，外国在华企业中产生了中国最早的一批产业工人。',
   '19 世纪 60 年代以后，在洋务企业中又产生了一批产业工人。',
   '19 世纪 70 年代以后，在中国民族资本主义企业中，产业工人队伍再一次得到扩充。']},
  {lv:'zp',ty:'简答题',q:'十八世纪西方殖民主义扩张对中国的威胁',a:[
   '商品生产的无限增长需要开辟新的原料市场和产品市场，寻求新的殖民地。开辟新的市场和转移国内矛盾的需要，促使西方列强发动新的侵略战争，他们把目标瞄向中国。',
   '自 1840 年鸦片战争以来，外国列强通过军事侵略迫使中国签订一系列不平等条约，在政治上侵犯中国主权，经济上掠夺中国财富，文化上麻醉中国民众，使中国进入半殖民地半封建社会。']}
 ]
},
ch2:{

  {name:'洋务新政的兴办',stars:3,lines:[

  {name:'维新派倡导救亡和变法的活动',stars:4,lines:[

  {name:'维新派和守旧派的论战',stars:5,lines:[

  {name:'昙花一现的百日维新',stars:1,lines:[

 qa:[
  {lv:'jg',ty:'简答题',q:'太平天国农民战争失败的主要原因',a:[
   '农民阶级不是新的生产力和生产关系的代表（根本原因）。',
   '军事战略上出现重大失误。',
   '太平天国是以宗教来发动和组织群众的。',
   '不能正确对待儒学。',
   '对西方列强缺乏理性认识。',
   '教训：农民不能担负起领导反帝反封建斗争取得胜利的重任。']},
  {lv:'jg',ty:'简答题',q:'洋务运动的指导思想和洋务派举办的洋务事业',a:[
   '指导思想是“中学为体，西学为用”。',
   '洋务事业：①兴办近代企业，最早兴办军用工业，70 年代开始兴办民用企业；②建立新式海陆军；③创办新式学堂、派遣留学生。']},
  {lv:'jg',ty:'简答题',q:'论述洋务运动的历史作用',a:[
   '工业：客观上促进了工业和民族资本主义的发展。',
   '教育：成为近代教育的开端。',
   '社会：社会风气和价值观念开始变化。']},
  {lv:'jg',ty:'论述题',q:'19世纪末维新派与守旧派论战的主要问题及意义',a:[
   '主要问题：①要不要变法；②要不要兴民权、设议院，实行君主立宪；③要不要废八股、改科举和兴学堂。',
   '意义：是资产阶级思想与封建主义思想在中国的第一次正面交锋，比较集中地反映了近代中国在文化思想领域中学与西学、新学与旧学之争，为维新变法运动作了思想舆论的准备。']},
  {lv:'jg',ty:'简答题',q:'简述戊戌维新运动的历史意义（口诀：思政国资）',a:[
   '是一次爱国救亡运动。',
   '是一场资产阶级性质的政治改良运动。',
   '是一场思想启蒙运动。']},
  {lv:'gp',ty:'简答题',q:'太平天国定都天京后先后颁布的两个重要纲领及其特点',a:[
   '1853 年冬颁布《天朝田亩制度》，这是一个以解决农民土地问题为中心的比较完整的社会改革方案，最能体现太平天国社会理想。',
   '《资政新篇》是一个带有鲜明资本主义色彩的改革与建设方案。']},
  {lv:'gp',ty:'论述题',q:'太平天国农民战争的历史意义',a:[
   '沉重打击了封建统治阶级，强烈撼动了清政府的统治根基；其规模之大、时间之长、影响之深，是以往历次农民起义都比不上的。',
   '它是中国旧式农民战争的最高峰，把千百年来农民对拥有土地的渴望在《天朝田亩制度》中比较完整地表达出来；《资政新篇》是中国近代史上第一个比较系统的发展资本主义的方案。',
   '它在一定程度上削弱了封建统治的精神支柱。',
   '它有力地打击了外国侵略势力。',
   '它和亚洲其他国家的民族解放运动汇合在一起，冲击了西方殖民主义在亚洲的统治。']},
  {lv:'gp',ty:'简答题',q:'简述洋务运动失败的原因（口诀：缝衣服玩）',a:[
   '洋务运动具有封建性。',
   '洋务企业的管理具有腐朽性。',
   '洋务运动对西方列强具有依赖性。']},
  {lv:'gp',ty:'论述题',q:'简述戊戌维新运动失败的原因和教训',a:[
   '主要原因：慈禧太后为首的强大守旧势力的反对。',
   '自身局限：①不敢否定封建主义——政治上不敢否定封建君主专制制度，经济上不敢否定封建土地所有制，文化上不敢否定封建专制主义文化而托古改制；②对帝国主义抱有幻想；③惧怕人民群众。',
   '教训：企图通过统治者进行自上而下的改良道路是行不通的，必须采用革命的手段。']},
  {lv:'zp',ty:'简答题',q:'《资政新篇》中关于政治和经济的主要内容',a:[
   '政治方面：主张“禁朋党之弊”，加强中央集权，制定法律、制度；设“暗柜”监督官员，改革弊政。',
   '经济方面：主张发展近代工矿、交通、邮政、金融等事业；吸取外国科学技术，奖励科技发明和机器制造；提倡资本主义的雇佣劳动制。']},
  {lv:'zp',ty:'简答题',q:'《天朝田亩制度》的土地分配方案及其意义',a:[
   '确立了平均分配土地的方案，田地分为九等，好坏搭配，按人口平均分配，16 岁以下减半。',
   '它是一个以解决土地问题为中心的比较完整的社会改革方案，代表了农民要求平均分配土地的强烈愿望，反映了农民反对封建土地所有制的普遍要求。']},
  {lv:'zp',ty:'简答题',q:'资产阶级维新派宣传维新变法的主要活动',a:[
   '①向皇帝上书；②著书立说；③介绍外国的变法；④办学会、办报纸、设学堂。']},
  {lv:'zp',ty:'简答题',q:'19世纪末维新派对封建主义妥协的主要表现',a:[
   '政治上不敢根本否定封建君主制度，幻想通过和平、合法手段实现君主立宪制。',
   '经济上要求发展民族资本主义，但没有触及封建主义经济基础——封建土地所有制。',
   '思想上提倡学习西方，但仍要借古代圣贤孔子之名来“托古改制”。']},
  {lv:'zp',ty:'简答题',q:'洋务运动兴办军用工业和民用企业的目的',a:[
   '兴办军用工业首先是镇压太平天国起义，同时也是为了加强海防、边防，抵御外国侵略。',
   '兴办民用企业主要是为解决兴办军事工业对煤铁等原料的需求、交通运输的需要，以及试图用民用企业的利润弥补军用工业的亏空。']}
 ]
},
ch3:{
 choice:[
  {name:'清末“新政”及其破产',stars:2,lines:[
   '1904—1905 年外国侵略者为争夺在华利益而在中国东北进行的战争是<span class="hl">日俄战争</span>。',
   '1894 年孙中山在檀香山组织中国第一个资产阶级革命组织——<span class="hl">兴中会</span>，誓词：“驱除鞑虏，恢复中国，创立合众政府”。']},
  {name:'资产阶级民主革命的开始',stars:3,lines:[
   '章炳麟《驳康有为论革命书》、邹容《革命军》、陈天华《警世钟》《猛回头》。',
   '第一个全国性的资产阶级政党——<span class="hl">中国同盟会（1905 年）</span>，标志资产阶级民主革命进入新阶段；机关报《民报》，纲领：驱除鞑虏，恢复中华，创立民国，平均地权。']},
  {name:'各地武装起义与保路风潮',stars:4,lines:[

   '辛亥革命达到高潮的起义是<span class="hl">武昌起义</span>，新成立的湖北军政府都督是黎元洪。']},
  {name:'中华民国临时政府宣告成立',stars:3,lines:[
   '中国历史上第一部具有资产阶级共和国宪法性质的法典是<span class="hl">《中华民国临时约法》</span>。',
   '中国历史上第一次比较完全意义上的资产阶级民主革命是<span class="hl">辛亥革命</span>。']},
  {name:'反对北洋军阀的斗争',stars:5,lines:[
   '反对袁世凯刺杀宋教仁和“善后大借款”→发动“二次革命”（史称“赣宁之役”）；反对袁世凯称帝→发动护国运动。',
   '反对北洋军阀破坏《临时约法》和拒绝恢复国会→1917 年第一次护法运动；旧民主主义革命终结的标志是第二次护法运动失败。',
   '“二次革命”中在江西湖口通电讨袁的是李烈钧；1914 年 7 月孙中山在东京成立中华革命党。',
   '护国运动中宣布云南独立的将领是蔡锷；1919 年 10 月孙中山将中华革命党改组为中国国民党。']}
 ],
 qa:[
  {lv:'jg',ty:'论述题',q:'论述孙中山三民主义学说的基本内容及其意义',a:[
   '民族主义（“驱除鞑虏，恢复中华”）：一是以革命手段推翻清王朝，二是变“次殖民地”的中国为独立的中国。',
   '民权主义（“创立民国”）：推翻封建君主专制制度，建立资产阶级民主共和国。',
   '民生主义（“平均地权”）：核定地价，按价征税，涨价归公，按价收买。',
   '意义：是一个比较完备的民主主义革命纲领，推动了革命思想的传播和革命运动的发展。']},
  {lv:'jg',ty:'论述题',q:'1905—1907年资产阶级革命派与改良派的论战及其意义',a:[

  {lv:'jg',ty:'论述题',q:'论述辛亥革命胜利的历史意义（口诀：思变清帝国）',a:[
   '推翻了清王朝在中国的统治，沉重打击了中外反动势力，为中国人民革命斗争的发展开辟了道路。',
   '结束了统治中国两千多年的封建君主专制制度，建立了中华民国。',
   '传播了民主共和理念，推动了中华民族的思想解放。',
   '推动了近代中国社会变革，推动了民族资本主义经济发展，促进了社会风气改变和人们的精神解放。',
   '打击了帝国主义在华势力，推动了亚洲各国民族解放运动的高涨。']},
  {lv:'jg',ty:'简答题',q:'封建军阀专制统治的形成',a:[

   '经济：北洋政府竭力维护帝国主义、地主阶级和买办资产阶级的利益。',

  {lv:'gp',ty:'简答题',q:'1912年建立的南京临时政府是一个资产阶级共和国性质的革命政权',a:[

  {lv:'gp',ty:'论述题',q:'试述资产阶级领导的辛亥革命的历史局限性',a:[
   '没有提出彻底的反对帝国主义和反对封建主义的革命纲领。',
   '没有充分发动和依靠民众。',
   '没有建立坚强有力的革命政党。']},
  {lv:'gp',ty:'简答题',q:'辛亥革命失败后，孙中山为捍卫资产阶级民主革命成果所进行的斗争',a:[
   '反对袁世凯刺杀宋教仁和“善后大借款”，发动“二次革命”。',
   '反对袁世凯称帝，发动护国运动。',
   '反对北洋军阀破坏《中华民国临时约法》和拒绝恢复国会，发动第一次、第二次护法运动。']},
  {lv:'zp',ty:'简答题',q:'简述清末“新政”的主要内容',a:[
   '①改革官制，整顿吏治；②改革兵制，训练新军，各省筹建武备学堂，裁汰绿营和防勇；③改革学制，提倡新学，从 1906 年起废除科举考试；④奖励工商，兴办实业，颁布《商律》。']},
  {lv:'zp',ty:'简答题',q:'辛亥革命时期中国资产阶级革命派的阶级基础和骨干力量',a:[
   '阶级基础是中国民族资产阶级。',
   '骨干力量是一批资产阶级、小资产阶级知识分子。',
   '这个群体是随着 19 世纪末 20 世纪初清政府兴学堂、派留学生而逐渐形成的。']},
  {lv:'zp',ty:'简答题',q:'兴中会的成立及其誓词',a:[

   '誓词：驱除鞑虏，恢复中国，创立合众政府。']},
  {lv:'zp',ty:'简答题',q:'资产阶级革命派在与改良派论战中存在的历史局限性',a:[

  {lv:'zp',ty:'简答题',q:'简述辛亥革命的局限性（口诀：党、人、纲都不行）',a:[
   '没有提出彻底的反对帝国主义和反对封建主义的革命纲领。',
   '没有充分发动和依靠民众。',
   '没有建立坚强有力的革命政党；同盟会组织松懈、派系纷杂，缺乏统一稳定的领导核心。']}
 ]

 qa:[
  {lv:'jg',ty:'论述题',q:'试述五四前新文化运动的主要内容及其历史意义',a:[
   '主要内容：①提倡民主和科学——民主指资产阶级民主思想和民主制度，提倡个性解放、平等自由，科学指自然科学，提倡以科学精神和方法研究社会；②提倡白话文、新文学，主张文学革命。',
   '意义：①客观上具有振聋发聩的作用；②掀起了思想解放的潮流。']},
  {lv:'jg',ty:'论述题',q:'俄国十月革命对中国革命的影响',a:[
   '给中国先进分子一个启示：经济文化落后的国家也可以用社会主义思想指引自己走向解放之路。',
   '苏维埃俄国号召反对帝国主义，以新的平等姿态对待中国，推动了社会主义思想在中国的传播。',
   '革命中工人和士兵广泛发动并赢得胜利的事实，昭示中国先进分子以新的方法开展革命。',
   '中国思想界产生了一批赞成十月革命、具有初步共产主义思想的知识分子。']},
  {lv:'jg',ty:'论述题',q:'五四运动的历史特点和意义',a:[
   '是一次彻底反帝反封建的革命运动，把中国人民反帝反封建斗争提升到一个新水平。',
   '广泛动员和组织了群众，是一场真正群众性的革命运动；工人阶级第一次作为独立政治力量登上历史舞台，在运动后期发挥主力军作用。',
   '促进了马克思主义在中国的广泛传播，促进了马克思主义同中国工人运动结合，为中国共产党成立作了思想和干部上的准备。',
   '是中国新民主主义革命的开端；五四运动后，无产阶级逐渐成为近代中国民族民主革命的领导者。']},
  {lv:'jg',ty:'论述题',q:'中国共产党成立的历史意义',a:[
   '给灾难深重的中国人民带来了光明和希望。',
   '中国人民有了先进的、坚强的政党作为凝聚自己力量的领导核心，中国革命面貌从此焕然一新。',
   '是开天辟地的大事件，深刻改变了近代以后中华民族发展的方向和进程、中国人民和中华民族的前途和命运、世界发展的趋势和格局。']},
  {lv:'jg',ty:'简答题',q:'1926—1927年北伐战争直接打击的目标和战略方针',a:[
   '直接目标是打倒帝国主义支持的北洋军阀：吴佩孚、孙传芳、张作霖。',
   '战略方针：首先进军两湖，消灭吴佩孚；然后引兵东向，消灭孙传芳；最后北上解决张作霖。']},
  {lv:'gp',ty:'论述题',q:'怎样认识中国共产党成立的历史特点',a:[
   '成立于俄国十月革命胜利、第二国际修正主义破产之后，得到共产国际指导帮助，以布尔什维克为榜样、按列宁建党原则建立，接受的是没有被修正主义阉割的马克思主义完整革命世界观和社会革命论。',
   '在半殖民地半封建中国的工人运动基础上产生，中国工人阶级具有坚强革命性，不存在欧洲那种工人贵族阶层，没有社会改良主义基础。',
   '一开始就是一个以马克思列宁主义理论为指导的党，是区别于第二国际社会改良党的新型工人阶级革命政党。']},
  {lv:'gp',ty:'论述题',q:'早期马克思主义思想运动的表现和历史特点',a:[
   '表现：①马克思主义著作的翻译和出版；②研究和宣传马克思主义的社团纷纷涌现；③大量进步刊物的创办。',
   '特点：①重视马克思主义基本理论学习，同第二国际社会民主主义划清界限；②注意从中国实际出发，初步形成马克思主义应与中国实际相结合的思想；③提出知识分子应忠于民众、到民间去，同劳动群众相结合。']},
  {lv:'gp',ty:'论述题',q:'中共二大制订的民主革命纲领及其意义',a:[
   '最高纲领是实现社会主义、共产主义。',
   '最低纲领（民主革命纲领）：消除内乱、打倒军阀、建设国内和平；推翻国际帝国主义压迫、达到中华民族完全独立；统一中国为真正民主共和国。这是半殖民地半封建社会条件下走向社会主义、共产主义不可超越的阶段。',
   '意义：第一次明确提出反帝反封建的民主革命纲领，解决了分清敌友这个革命首要问题；证明只有用马克思主义武装的中国共产党才能为中国革命指明方向。']},
  {lv:'gp',ty:'简答题',q:'北伐战争胜利进军的主要原因',a:[
   '国共合作实现、革命统一战线建立，特别是共产党员和共青团员的先锋模范作用是重要原因。',
   '北伐是反帝反封建军阀的正义革命战争，得到广大工农群众大力支持。',
   '得到苏联政府多方面援助，军事顾问帮助制定了正确的军事战略战术。']},
  {lv:'zp',ty:'简答题',q:'简述五四以前新文化运动的局限',a:[
   '倡导者没有揭示封建专制主义得以存在的社会根源，把资产阶级共和国方案失败的根本原因归于思想文化。',
   '把改造国民性置于优先地位，但脱离改造产生封建思想的社会环境的革命实践，仅靠少数人呐喊和有限宣传，目标难以实现。',
   '不少人在思想方法上存在绝对肯定或绝对否定的形式主义偏向。']},
  {lv:'zp',ty:'简答题',q:'中国早期马克思主义信仰者及其代表人物',a:[

  {lv:'zp',ty:'简答题',q:'中共三大的主要内容及意义',a:[

  {lv:'zp',ty:'简答题',q:'五四运动爆发的社会历史条件',a:[

  {lv:'zp',ty:'简答题',q:'中国国民党一大对三民主义的新阐释',a:[
   '民族主义突出反对帝国主义内容，强调对外争取完全独立，主张国内各民族一律平等。',
   '民权主义强调民权为一般平民所共有，不应为“少数人所得而私”。',

  {lv:'zp',ty:'简答题',q:'1924—1927年国民革命的历史意义',a:[
   '沉重打击帝国主义和封建主义统治势力，中国人民的觉悟程度和组织程度明显提高，是迎接未来革命胜利的一次伟大演习。',
   '扩大了中国共产党在中国人民中的政治影响，宣传了党在民主革命阶段的纲领，使党经受大革命洗礼、积累了初步经验。']},
  {lv:'zp',ty:'简答题',q:'新文化运动兴起的标志及其主要阵地',a:[
   '1915 年 9 月陈独秀在上海创办《青年杂志》（后改名《新青年》），是新文化运动兴起标志。',
   '蔡元培就任北大校长后聘陈独秀为文科学长，《新青年》编辑部迁京，李大钊等成为主要撰稿人；北京大学和《新青年》编辑部成为主要阵地。']},
  {lv:'zp',ty:'简答题',q:'中共四大的中心议题和主要贡献',a:[

  {lv:'zp',ty:'简答题',q:'新中国成立初期土地改革运动及其意义',a:[

  {lv:'zp',ty:'简答题',q:'中国共产党第一次全国代表大会的重要内容',a:[

  {lv:'zp',ty:'简答题',q:'国民革命失败的原因',a:[

  {name:'国民党在全国统治的建立',stars:5,lines:[
   '国民革命失败后，以蒋介石为代表的国民党集团建立了全国独裁统治。',
   '1928 年在东北宣布“服从国民政府、改易旗帜”的是<span class="hl">张学良</span>；官僚资本垄断活动首先和主要从金融业开始。',
   '1928 年 10 月国民党通过《训政纲领》，废除北洋时期形式上存在的议会制度。']},
  {name:'中间党派的活动及其政治主张（口诀：演员、梁乡、培育）',stars:2,lines:[
   '1930 年 8 月建立中国国民党临时行动委员会（第三党），邓演达领导。',
   '梁漱溟为首的乡村建设派；黄炎培为首的中华职业教育社。',
   '中国青年党（曾琦、李璜、左舜生，又称醒狮派/国家主义派）；中国国家社会党（张君劢、张东荪、罗隆基，又称再造派）。']},
  {name:'中国共产党人发动武装斗争和土地革命',stars:4,lines:[
   '南昌起义：①武装反抗国民党反动统治的第一枪；②独立领导革命战争、创建人民军队和武装夺取政权的伟大开端；③揭开土地革命战争序幕。',
   '秋收起义：①公开打出“工农革命军”旗帜；②有众多工农武装参加。三湾改编是建设党领导的新型人民军队的重要开端。',
   '八七会议确定了土地革命和武装斗争的方针。']},
  {name:'中国共产党人对中国革命道路的探索',stars:3,lines:[
   '毛泽东《星星之火，可以燎原》提出以“乡村为中心”思想，初步形成<span class="hl">农村包围城市、武装夺取政权</span>理论。',
   '《反对本本主义》：阐明坚持辩证唯物主义思想路线，提出“中国革命斗争的胜利要靠中国同志了解中国情况”。']},
  {name:'土地革命的深入',stars:3,lines:[
   '1928 年 12 月《井冈山土地法》是中共第一个土地法；《兴国土地法》将“没收一切土地”改为“没收一切公共土地及地主阶级的土地”。',
   '1931 年三次反“围剿”胜利后形成中央革命根据地。']},
  {name:'“左”倾教条主义的危害',stars:2,lines:[
   '瞿秋白“左”倾盲动错误（1927.11—1928.4）；李立三“左”倾冒险主义（1930.6—9）；陈绍禹（王明）“左”倾教条主义（1931.1—1935.1）。',
   '第五次反“围剿”失败后，1934 年 10 月开始战略转移的是红一方面军。']},
  {name:'长征的胜利结束',stars:3,lines:[
   '长征途中具有历史转折意义的会议是<span class="hl">遵义会议</span>。',
   '1935 年中央红军到达陕北吴起镇；1936 年红二、红四方面军同红一方面军在甘肃会宁、静宁将台堡会师，长征胜利结束。']}
 ],
 qa:[
  {lv:'jg',ty:'论述题',q:'论述南昌起义及其历史作用',a:[
   '1927 年 8 月 1 日，以周恩来为书记的前敌委员会及贺龙、叶挺、朱德、刘伯承等，率领共产党掌握或影响下的北伐军 2 万多人在南昌起义。',
   '历史作用：①打响了武装反抗国民党反动统治的第一枪；②成为共产党独立领导革命战争、创建人民军队和武装夺取政权的伟大开端；③揭开了土地革命战争的序幕。']},
  {lv:'jg',ty:'论述题',q:'论述遵义会议的内容及其历史意义',a:[
   '集中全力解决军事和组织问题，多数人同意毛泽东为代表的正确意见，批评博古、李德第五次反“围剿”错误。',
   '增选毛泽东为中央政治局常委；会后由张闻天代替博古负总责，成立毛泽东、周恩来、王稼祥组成的新三人团，全权负责红军军事行动。',
   '开始确立以毛泽东为代表的马克思主义正确路线在党中央的领导地位，在极其危急情况下挽救了党、挽救了工农红军、挽救了中国革命，成为党的历史上一个生死攸关的转折点。',
   '证明中国共产党敢于正视并纠正自身错误，具有自我净化、自我发展的能力。']},
  {lv:'jg',ty:'论述题',q:'中国工农红军长征胜利的历史意义（口诀：转西北播精火）',a:[
   '是一部伟大的革命英雄主义史诗，粉碎了国民党“围剿”红军、消灭革命力量的企图，是中国革命转危为安的关键。',
   '把中国革命的大本营放在西北，为迎接抗日救亡运动新高潮准备了条件。',
   '保存并锤炼了中国革命的骨干力量，这是党和红军极为宝贵的精华。',
   '播撒了革命的火种；使各族人民更加认识到只有中国共产党才能领导人民翻身解放。',
   '中国共产党人和红军将士用生命和热血铸就了伟大的长征精神。']},
  {lv:'gp',ty:'简答题',q:'井冈山革命根据地创建的历史意义（口诀：一把火一条路）',a:[
   '点燃了“工农武装割据”的星星之火，为共产党领导的其他各地武装起义树立了榜样。',
   '从实践上开辟了在敌我力量悬殊情况下深入农村保存和发展革命力量的正确道路，代表了大革命失败后中国革命发展的正确方向。']},
  {lv:'gp',ty:'简答题',q:'简述八七会议的内容及其历史地位',a:[
   '彻底清算大革命后期陈独秀右倾机会主义错误，确定土地革命和武装斗争方针，选出以瞿秋白为首的中央临时政治局；毛泽东提出“须知政权是由枪杆子中取得的”著名论断。',
   '地位：给思想混乱、组织涣散中的中国共产党指明出路，是由大革命失败到土地革命战争兴起的历史转折点。']},
  {lv:'gp',ty:'简答题',q:'1927年9月湘赣边界秋收起义的特点',a:[
   '放弃了“左派国民党”运动旗号，公开打出“工农革命军”旗帜。',
   '不仅是军队行动，而且有数量众多的工农武装参加。']},
  {lv:'gp',ty:'简答题',q:'简述土地革命前中期中国共产党内的“左”倾错误',a:[
   '瞿秋白“左”倾盲动错误（1927.11—1928.4）。',
   '李立三“左”倾冒险主义（1930.6—9）。',
   '陈绍禹（王明）“左”倾教条主义（1931.1—1935.1）。']},
  {lv:'zp',ty:'简答题',q:'大革命失败后国民党政府实行军事独裁统治的主要表现',a:[
   '建立庞大军队，严密控制和镇压人民。',
   '建立密布全国的特务系统，绑架或暗杀革命者和异己分子。',
   '大力推行保甲制度，保甲内各户实行联坐。',
   '厉行文化专制主义，剥夺人民言论和出版自由。']},
  {lv:'zp',ty:'简答题',q:'近代中国民族资本主义经济的特点',a:[
   '在国民经济中所占比重很小，始终没有成为中国社会经济主要形式。',
   '工业资本比重小，商业资本和金融资本比重大。',
   '以纺织、食品等轻工业为主，缺乏重工业基础，不能构成完整工业体系。',
   '企业规模狭小、技术设备落后、劳动生产率低。',
   '和外国垄断资本、本国官僚资本以及封建势力有千丝万缕联系。']},
  {lv:'zp',ty:'简答题',q:'“三湾改编”的主要内容及意义',a:[
   '将原有的一个师缩编为一个团。',
   '在部队中建立共产党各级组织，把党的支部建在连上。',
   '成立各级士兵委员会，部队内部实行民主管理。',
   '意义：成为建设共产党领导的新型人民军队的重要开端。']},
  {lv:'zp',ty:'简答题',q:'简述中国红色政权存在和发展的原因和条件',a:[
   '根本原因：中国是几个帝国主义国家间接统治的、政治经济发展极端不平衡的半殖民地半封建大国。',
   '客观条件：国民革命的影响；全国革命形势继续向前发展。',
   '主观条件：相当力量正式红军的存在；共产党组织坚强有力、各项政策正确贯彻。']},
  {lv:'zp',ty:'简答题',q:'1931年中华苏维埃第一次全国代表大会主要内容',a:[
   '通过《中华苏维埃共和国宪法大纲》及土地法令、劳动法等法律文件。',
   '选举产生中华苏维埃共和国中央执行委员会，宣告中华苏维埃共和国临时中央政府成立，毛泽东当选主席。']},
  {lv:'zp',ty:'简答题',q:'20世纪20年代后期至30年代前期党内屡次出现“左”倾错误的主要原因',a:[
   '八七会议后党内一直存在浓厚的、近乎拼命的冲动，没有从指导思想上认真清理。',
   '全党马克思主义理论准备不足，理论素养不高，实践经验缺乏。',
   '共产国际干预及对王明的全力支持，使许多人失去识别和抵制能力。']},
  {lv:'zp',ty:'论述题',q:'中国工农红军铸就的长征精神',a:[
   '把人民和中华民族根本利益看得高于一切，坚定革命理想信念、坚信正义事业必然胜利的精神。',
   '为救国救民不惜付出一切牺牲的精神。',
   '坚持独立自主、实事求是、一切从实际出发的精神。',
   '顾全大局、严守纪律、紧密团结的精神。',
   '紧紧依靠人民群众，同人民生死相依、艰苦奋斗的精神。']}
 ]
},
ch6:{
 choice:[
  {name:'从九一八事变到卢沟桥事变',stars:4,lines:[
   '1931 年日本制造<span class="hl">九一八事变</span>（中国抗日战争起点）；1935 年制造侵略华北的华北事变。',
   '1937 年 7 月制造发动全面侵华战争的<span class="hl">卢沟桥事变</span>，中华民族进入全民族抗战。']},
  {name:'残暴的殖民统治',stars:2,lines:[
   '1932 年日本策划建立的傀儡政权是伪“满洲国”。',
   '1940 年 3 月在南京成立伪“中华民国国民政府”的是汪精卫。']},
  {name:'抗日救亡运动与部分国民党人合作抗日',stars:3,lines:[
   '1933 年 5 月冯玉祥在张家口成立察哈尔抗日同盟军；1933 年 11 月蔡廷锴、蒋光鼐发动福建事变。',
   '1935 年 12 月瓦窑堡会议提出重建抗日民族统一战线新政策；一二·九运动标志抗日救亡运动新高潮到来。']},
  {name:'战略防御阶段的正面战场',stars:4,lines:[
   '战略防御阶段：1937 年卢沟桥事变至 1938 年 10 月广州、武汉失守。',
   '1938 年台儿庄战役由李宗仁领导，是正面战场获胜战役；佟麟阁、赵登禹在北平南苑战斗中牺牲；谢晋元率“八百壮士”据守四行仓库。']},
  {name:'战略相持阶段的正面战场',stars:4,lines:[
   '战略相持阶段：1938 年 10 月至 1943 年 12 月；日本对国民政府以政治诱降为主、军事为辅。',
   '国民党五届五中全会确定“防共、限共、溶共、反共”方针，由片面抗战转为消极抗战。',
   '1940 年 5 月枣宜会战张自忠殉国；1942 年中国远征军入缅作战，戴安澜殉国。']},
  {name:'大后方抗日民主运动',stars:2,lines:[
   '1941 年 3 月成立中国民主政团同盟；1944 年林伯渠提出废除国民党一党专政、成立民主联合政府主张。']},
  {name:'制定全面抗战路线',stars:2,lines:[
   '1937 年 8 月中共制定《抗日救国十大纲领》的重要会议是<span class="hl">洛川会议</span>。']},
  {name:'敌后战场的开辟',stars:3,lines:[
   '中国军队取得第一次重大胜利的战役是<span class="hl">平型关大捷</span>；1940 年 8—12 月八路军发动百团大战。',
   '抗战中捐躯：左权（八路军副参谋长）、杨靖宇（东北抗联第一路军总指挥）。']},
  {name:'延安整风运动，实事求是思想路线',stars:3,lines:[
   '整风内容：①反对主观主义以整顿学风（最主要任务）；②反对宗派主义以整顿党风；③反对党八股以整顿文风。']},
  {name:'在党的国际地位的确立',stars:4,lines:[
   '1945 年出席联合国制宪会议（旧金山会议）的中国代表团中，解放区代表是<span class="hl">董必武</span>。']}
 ],
 qa:[
  {lv:'jg',ty:'论述题',q:'试论《论持久战》的主要内容及其意义',a:[
   '系统阐述抗日战争的特点、前途和发展规律，阐明持久抗战总方针。',
   '中日双方存在互相矛盾的四个特点：敌强我弱、敌小我大、敌退步我进步、敌寡助我多助。敌强我弱决定抗战只能是持久战；日本小国、退步、野蛮侵略而失道寡助，中国大国、进步、正义反侵略而得道多助，最后胜利属于中国。',
   '已有政治上成熟的共产党及其领导的人民军队和抗日根据地；科学预测抗战将经历战略防御、战略相持、战略反攻三阶段，其中战略相持是取得最后胜利的最关键阶段。',
   '意义：抓住了中日战争的时代特点和战争性质，揭示抗战发展规律和争取胜利必须实行的战略方针，对全国抗战起了积极作用。']},
  {lv:'jg',ty:'论述题',q:'论述中国共产党巩固和扩大抗日民族统一战线的策略总方针',a:[
   '总方针：发展进步势力，争取中间势力，孤立顽固势力。',
   '进步势力指工人、农民和城市小资产阶级，是统一战线基础和抗日主要依靠力量；放手发动群众和抗日武装是整个策略的中心环节。',
   '中间势力指民族资产阶级、开明绅士和地方实力派；争取条件是共产党有充足力量、尊重其利益、并能对顽固派斗争取得胜利。',
   '顽固势力指以蒋介石集团为代表的亲英美派大地主大资产阶级抗日派，对其实行又联合又斗争政策，坚持有理、有利、有节原则。']},
  {lv:'jg',ty:'论述题',q:'论述中国人民抗日战争胜利的原因（口诀：全世界爱党）',a:[
   '以爱国主义为核心的伟大民族精神，是抗日战争胜利的决定因素。',
   '中国共产党的中流砥柱作用是胜利关键，党坚持全面抗战路线，成为坚持抗战的中坚力量。',
   '全民族抗战是重要法宝，敌后战场与正面战场协力合作，形成共同抗击侵略者的战略局面。',
   '世界爱好和平正义的国家人民、国际组织及反法西斯力量给予了同情和支持。']},
  {lv:'jg',ty:'论述题',q:'中国人民抗日战争在世界反法西斯战争中的地位',a:[
   '是世界反法西斯战争的东方主战场，开始最早、持续时间最长，对日本侵略者的彻底覆灭起决定性作用。',
   '持久抗战遏制了日本“北进”计划、迟滞其“南进”步伐，大大减轻其他战场压力。',
   '作为盟军对日作战的重要后方基地，提供大量战略物资和军事情报，并对盟军给予实际支援。',
   '为战胜法西斯、维护世界和平付出巨大牺牲、作出伟大贡献。']},
  {lv:'gp',ty:'简答题',q:'一二·九运动及其历史意义',a:[
   '1935 年 12 月 9 日，在中共领导下北平学生举行声势浩大的抗日游行。',
   '意义：打击了日本吞并华北的计划，促进中华民族觉醒，标志中国人民抗日救亡运动新高潮到来。']},
  {lv:'gp',ty:'简答题',q:'延安整风运动的主要内容和意义（口诀：延安整风整三风）',a:[
   '反对主观主义以整顿学风、反对宗派主义以整顿党风、反对党八股以整顿文风；反对主观主义是最主要任务。',
   '意义：是一场伟大的思想解放运动，在全党确立起一切从实际出发、理论联系实际、实事求是的马克思主义思想路线。']},
  {lv:'gp',ty:'论述题',q:'中国抗日战争胜利的伟大历史意义',a:[
   '彻底粉碎日本军国主义殖民奴役中国的图谋，迫使日本归还窃取的东北、台湾、澎湖列岛等领土，捍卫国家主权和领土完整，洗刷民族耻辱。',
   '重新确立中国在世界上的大国地位，中国国际地位显著提高。',
   '促进了中华民族觉醒，开辟了中华民族伟大复兴的光明前景。']},
  {lv:'zp',ty:'简答题',q:'简述西安事变及其和平解决',a:[

  {lv:'jg',ty:'论述题',q:'论述中华人民共和国的成立开辟了中国历史的新纪元（口诀：独社豫政权）',a:[
   '帝国主义压迫、奴役中国人民的历史从此结束，中华民族一洗百年屈辱，以崭新独立姿态自立于世界民族之林。',
   '封建主义、官僚资本主义统治历史结束，广大人民在政治上翻身，第一次成为新社会、新国家的主人。',
   '军阀割据、战乱频仍、匪患不断的历史结束，政局稳定，人民可以集中力量从事经济文化建设。',
   '从根本上改变中国社会发展方向，为新民主主义向社会主义过渡创造政治前提。',
   '中国共产党成为全国范围执政党，能够凝聚全国力量解放和发展生产力、造福各族人民。']},
  {lv:'jg',ty:'论述题',q:'论述过渡时期总路线反映了历史的必然',a:[
   '总任务是在相当长时期内逐步实现社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造。',
   '社会主义国营经济力量相对强大，是工业化的主要基础；社会主义工业化是国家独立富强的当然要求和必要条件。',
   '资本主义经济力量弱小，不能成为工业起飞基础；其发展为改造积累了初步经验。',
   '对个体农业进行社会主义改造是保证工业发展、实现工业化的必要条件；当时国际环境也促使中国选择社会主义。']},
  {lv:'jg',ty:'简答题',q:'我国农业社会主义改造中的过渡性经济组织形式及其性质',a:[
   '互助组——社会主义萌芽性质。',
   '初级农业生产合作社——半社会主义性质。',
   '高级农业生产合作社——社会主义性质。']},
  {lv:'jg',ty:'简答题',q:'国家对资本主义工商业采取和平赎买政策的特点',a:[
   '有偿而不是无偿、逐步而不是突然地改变资产阶级所有制。',
   '改造同时给予必要的工作安排。',
   '不剥夺资产阶级选举权，对拥护改造、有所贡献的代表人物给以恰当政治安排。']},
  {lv:'jg',ty:'论述题',q:'论述对个体农业进行社会主义改造的基本原则和方针',a:[
   '走先合作化、后机械化道路。',
   '发挥土改后农民两种积极性，经互助组、初级社、高级社由低到高，实行积极发展、稳步前进、逐步过渡方针。',
   '坚持自愿互利原则，典型示范、逐步推广；把是否增产作为衡量合作社好坏的标准；把社会改造同技术改造相结合。']},
  {lv:'jg',ty:'论述题',q:'社会主义改造基本完成的意义',a:[
   '社会主义基本经济制度在中国全面建立，是中国进入社会主义社会的最主要标志。',
   '是生产关系方面由私有制到公有制的伟大变革，对生产力发展直接起促进作用。',
   '创造性完成由新民主主义到社会主义的过渡，实现中国历史上最伟大最深刻的社会变革。']},
  {lv:'jg',ty:'论述题',q:'中共八大对国内主要矛盾和主要任务的分析',a:[
   '主要矛盾已经是人民对建立先进工业国的要求同落后农业国现实之间的矛盾，是人民对经济文化迅速发展需要同当前经济文化不能满足人民需要状况之间的矛盾。',
   '主要任务是集中力量解决这一矛盾，把我国尽快从落后农业国变为先进工业国。']},
  {lv:'jg',ty:'简答题',q:'陈云在中共八大提出的“三个主体、三个补充”思想',a:[
   '国家经营和集体经营为主体，一定数量个体经营为补充。',
   '计划生产为主体，一定范围自由生产为补充。',
   '国家市场为主体，一定范围自由市场为补充。']},
  {lv:'gp',ty:'论述题',q:'论述毛泽东关于社会主义发展阶段和现代化建设战略目标与步骤（助记：两步走）',a:[
   '社会主义可能分为不发达的社会主义和比较发达的社会主义两个阶段，后一阶段需要更长时间。',
   '战略目标是建成具有现代农业、现代工业、现代国防和现代科学技术的强国。',
   '步骤采取“两步走”：①建成独立的比较完整的工业体系和国民经济体系；②全面实现农业、工业、国防和科学技术现代化。']},
  {lv:'gp',ty:'简答题',q:'新中国建立初期党面临的主要问题和考验',a:[
   '能不能保卫人民胜利成果、巩固新生人民政权。',
   '能不能战胜严重经济困难、恢复发展国民经济。',
   '能不能巩固民族独立、维护国家主权安全。',
   '能不能经受执政考验、保持优良作风。']},
  {lv:'gp',ty:'论述题',q:'争取财政经济状况根本好转的三个条件及国民经济迅速恢复的原因',a:[
   '三个条件：土地改革完成、现有工商业调整、国家机构所需经费大量节减。',
   '原因：抓住恢复发展生产为中心，正确处理各项工作关系；对财经实行集中统一管理，制定“不要四面出击”等方针；加强执政党建设，抵制资产阶级腐蚀。']},
  {lv:'gp',ty:'简答题',q:'“三反”“五反”运动的主要内容',a:[
   '三反（党政机关）：反贪污、反浪费、反官僚主义。',
   '五反（工商业者）：反行贿、反偷税漏税、反盗窃国家资财、反偷工减料、反盗窃国家经济情报。']},
  {lv:'gp',ty:'简答题',q:'简述新民主主义社会的特点和性质',a:[
   '经济上存在五种成分：社会主义国营经济、半社会主义合作经济、个体经济、私人资本主义经济、国家资本主义经济。',
   '国内主要矛盾是工人阶级和资产阶级的矛盾；新民主主义社会不是凝固独立的社会形态，具有过渡性，处在深刻变动之中。']},
  {lv:'gp',ty:'论述题',q:'中共八大提出的经济、政治和执政党建设指导方针',a:[
   '经济上既反保守又反冒进，在综合平衡中稳步前进。',
   '政治上加强人民民主专政和民族团结，巩固人民民主统一战线，制定完备法律、健全法制。',
   '执政党建设上提高马克思列宁主义水平，健全民主集中制、坚持集体领导、反对个人崇拜，加强党和群众联系。']},
  {lv:'gp',ty:'论述题',q:'毛泽东关于正确区分两类不同性质矛盾学说的内容及意义',a:[
   '社会主义社会存在敌我矛盾和人民内部矛盾两类不同性质矛盾。',
   '敌我矛盾用强制、专政方法解决；人民内部矛盾用民主、说服教育的“团结—批评—团结”方法解决。',
   '创造性阐述社会主义社会矛盾学说，对科学社会主义和中国社会主义事业具有长远指导意义。']},
  {lv:'gp',ty:'简答题',q:'简述毛泽东关于社会主义社会基本矛盾的学说',a:[
   '社会主义社会基本矛盾仍是生产力和生产关系、经济基础和上层建筑之间的矛盾。',
   '这些矛盾可经过社会主义制度本身的自我调整和完善不断解决，为社会主义制度自我完善奠定理论基石。']},
  {lv:'gp',ty:'论述题',q:'老一辈革命家探索社会主义民主政治建设道路的理论贡献',a:[
   '造成又有集中又有民主、又有纪律又有自由的政治局面；把正确处理人民内部矛盾作为政治生活主题。',
   '处理好同民主党派关系，坚持长期共存、互相监督；切实保障人民当家作主权利。',
   '社会主义法制要保护劳动人民利益、保护社会主义经济基础。']},
  {lv:'gp',ty:'简答题',q:'探索社会主义建设道路中毛泽东关于经济建设的主要思想',a:[
   '正确处理重工业、轻工业和农业关系，以农、轻、重为序发展国民经济。',
   '在优先发展重工业条件下坚持“两条腿走路”；解决好综合平衡、积累与消费、生产与生活问题。',
   '处理好国家、集体和个人关系，统筹兼顾、适当安排。']},
  {lv:'zp',ty:'简答题',q:'过渡时期总路线的内容及其特点',a:[
   '逐步实现社会主义工业化，逐步实现对农业、手工业和资本主义工商业的社会主义改造。',
   '是社会主义建设和改造同时并举的总路线，体现发展生产力和变革生产关系的有机统一。']},
  {lv:'zp',ty:'简答题',q:'没收官僚资本对新中国国民经济发展的作用',a:[
   '削弱了资本主义经济力量（官僚资本与民族资本比例为 8:2），消灭了资本主义主要部分。',
   '壮大了社会主义国营经济，使人民共和国掌握国家经济命脉，国营经济居于主导地位。']},
  {lv:'zp',ty:'简答题',q:'1949—1952年向社会主义过渡的实际步骤',a:[
   '没收官僚资本，确立国营经济领导地位。',
   '开始将资本主义纳入国家资本主义轨道；引导个体农民土改后逐步走上互助合作道路。']},
  {lv:'zp',ty:'简答题',q:'抗美援朝战争的历史意义',a:[
   '打破美国军队不可战胜的神话。',
   '激发全国人民爱国主义和国际主义精神，成为推动各项社会改革的巨大动力；赢得相对稳定的和平环境，国际威望空前提高。']},
  {lv:'zp',ty:'简答题',q:'毛泽东发表《论十大关系》的意义',a:[
   '是开始探索中国自己的社会主义建设道路的标志，从经济和政治方面提出新的指导方针，为中共八大作理论准备。']},
  {lv:'zp',ty:'简答题',q:'探索社会主义建设道路中毛泽东理论贡献的主要方面',a:[
   '提出马克思主义与中国实际“第二次结合”的基本思想；提出社会主义社会矛盾学说；阐明建设社会主义的基本方针。']},
  {lv:'zp',ty:'简答题',q:'从“一五”到1976年新中国经济建设的重大成就及意义',a:[
   '最大成就是建立独立的、比较完整的工业体系和国民经济体系，从根本上解决工业化“从无到有”问题；开展大规模“三线”建设，改善工业和城市布局。',
   '意义：在赢得政治独立后赢得经济独立，为以后发展奠定牢固物质技术基础。']}
 ]
},

 qa:[
  {lv:'jg',ty:'论述题',q:'中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折（助记：马集转改）',a:[
   '冲破长期“左”的错误束缚，彻底否定“两个凡是”，高度评价真理标准问题讨论，重新确立马克思主义思想路线。',
   '否定“以阶级斗争为纲”，作出把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策。',
   '恢复民主集中制优良传统，审查解决历史遗留问题和重要领导人功过是非问题。',
   '结束徘徊中前进局面，开始各领域全面拨乱反正，形成以邓小平为核心的党中央领导集体，揭开改革开放序幕。']},
  {lv:'jg',ty:'简答题',q:'中共十一届六中全会“第二个历史决议”的主要内容及意义',a:[
   '科学评价毛泽东和毛泽东思想的历史地位，对毛泽东思想科学体系和活的灵魂作概括。',
   '根本否定“文化大革命”的理论和实践，对新中国成立以来重大历史事件作出基本结论，肯定并指明建设社会主义现代化强国道路和前进方向。',
   '意义：标志指导思想上拨乱反正胜利完成，体现党纠正错误、探索新道路的能力。']},
  {lv:'jg',ty:'简答题',q:'简述中共十三大制定的“三步走”战略（助记：温饱小康现代化）',a:[
   '国民生产总值比 1980 年翻一番，解决人民温饱问题。',
   '到 20 世纪末国民生产总值再增长一倍，人民生活达到小康水平。',
   '到 21 世纪中叶人均国民生产总值达到中等发达国家水平，人民生活比较富裕，基本实现现代化。']},
  {lv:'gp',ty:'简答题',q:'简述关于“真理标准问题的大讨论”',a:[
   '1978 年 5 月《光明日报》发表《实践是检验真理的唯一标准》，全国展开大讨论。',
   '冲破“两个凡是”思想束缚，是继延安整风后又一场马克思主义思想解放运动，成为拨乱反正和改革开放的思想先导，为重新确立实事求是思想路线、实现历史性转折作了思想理论准备。']},
  {lv:'gp',ty:'论述题',q:'1981年《关于建国以来党的若干历史问题的决议》的主要内容及意义',a:[
   '科学评价毛泽东和毛泽东思想历史地位，指出毛泽东功绩是第一位、错误第二位；概括毛泽东思想科学体系和活的灵魂。',
   '根本否定“文化大革命”，对重大历史事件作出结论，肯定并指明建设社会主义现代化强国道路。',
   '意义：标志指导思想上拨乱反正胜利完成，表明中国共产党是成熟、坚强的马克思主义政党。']},
  {lv:'gp',ty:'简答题',q:'1979年邓小平提出的四项基本原则及其重要性',a:[
   '坚持社会主义道路，坚持人民民主专政，坚持共产党领导，坚持马克思列宁主义、毛泽东思想。',
   '是实现四个现代化的根本前提，动摇其中任何一项就动摇整个社会主义现代化建设事业。']},
  {lv:'gp',ty:'简答题',q:'社会主义精神文明建设的根本任务',a:[
   '培养有理想、有道德、有文化、有纪律的社会主义公民。',
   '提高整个中华民族的思想道德素质和科学文化素质。']},
  {lv:'gp',ty:'论述题',q:'中共十三大的历史贡献',a:[
   '系统阐述社会主义初级阶段理论（我国已是社会主义社会、但还处在初级阶段）。',
   '概括党在社会主义初级阶段“一个中心、两个基本点”的基本路线。',
   '提出经济体制和政治体制改革任务目标，正式制定“三步走”战略部署。']},
  {lv:'gp',ty:'简答题',q:'1992年南方谈话提出的判断改革开放是非的主要标准',a:[
   '是否有利于发展社会主义社会的生产力。',
   '是否有利于增强社会主义国家的综合国力。',
   '是否有利于提高人民的生活水平。']},
  {lv:'gp',ty:'简答题',q:'简述邓小平关于社会主义本质的内容',a:[
   '计划多一点还是市场多一点，不是社会主义与资本主义的本质区别；计划和市场都是经济手段。',
   '社会主义本质是解放生产力、发展生产力，消除两极分化，最终达到共同富裕。']},

/* ============================================================
   渲染辅助
   ============================================================ */
function stars(n){let s='';for(let i=1;i<=5;i++){s+=i<=n?'★':'<span class="dim">★</span>';}return '<span class="stars">'+s+'</span>';}
function escJoin(arr){return arr.join('');}

/* 渲染选择题知识块 */
function renderChoice(blocks){
  return blocks.map(b=>{
    let inner=(b.lines||[]).map(x=>`<div class="l">${x}</div>`).join('');
    if(b.mini){inner+='<div class="mini">'+b.mini.map(m=>`
      <div class="m"><span class="when">${m.when}</span><span class="mn">${m.name}</span><div class="md">${m.det}</div></div>`).join('')+'</div>';}
    if(b.grid){inner+='<div class="grid2">'+b.grid.map(g=>`<div class="subbox"><div class="t">${g.t}</div><p>${g.p}</p></div>`).join('')+'</div>';}
    return `<div class="block-card"><div class="bh"><span class="bn serif">${b.name}</span>${b.stars?stars(b.stars):''}</div>${inner}</div>`;
  }).join('');
}

/* 渲染主观题 */
const LVNAME={jg:'极高频',gp:'高频',zp:'中频'};
function renderQA(items,filter){
  return items.filter(q=>filter==='all'||q.lv===filter).map((q,i)=>{
    const pts=q.a.map((p,j)=>{
      if(typeof p==='object'){
        return p.sub.map((s,k)=>`<div class="ap sub"><span class="pn">（${k+1}）</span>${s}</div>`).join('');
      }
      return `<div class="ap"><span class="pn">（${j+1}）</span>${p}</div>`;
    }).join('');
    return `<div class="qa" data-lv="${q.lv}">
      <div class="q"><span class="lv ${q.lv}">${LVNAME[q.lv]}</span>
        <span class="qt serif">${q.q}<span class="ty">${q.ty||''}</span></span>
        <span class="ar">+</span></div>
      <div class="a"><div class="ain">${pts}</div></div></div>`;
  }).join('');
}

/* 首页视图 */
function viewHome(){
  const cards=META.map((m,i)=>{
    const ch=DATA[m.id];
    const cnt=ch&&ch.qa?ch.qa.length:0;
    return `<div class="ov-row" onclick="location.hash='#/${m.id}'">
      <div class="when">${m.range}</div>
      <div class="dotcol"><span class="d"></span></div>
      <div class="ov-card">
        <div class="t serif"><span class="n">第${'一二三四五六七八九十'[i]}章</span>${m.title}</div>
        <div class="d2">${m.lead}</div>
        <div class="tags"><span class="tag">${m.range}</span><span class="tag">主观题 ${cnt} 道</span></div>
      </div></div>`;
  }).join('');
  return `
  <div class="home-hero">
    <span class="eyebrow serif">考前60分 · 主观题带背</span>
    <h1 class="serif">中国近现代史纲要</h1>
    <p>一条时间线，十个章节 —— 选择题考点 + 主观题带背 + 大事年表</p>
    <div class="stats">
      <div class="s"><b>10</b><span>时间线章节</span></div>
      <div class="s"><b>${META.reduce((s,m)=>s+((DATA[m.id]&&DATA[m.id].qa)?DATA[m.id].qa.length:0),0)}</b><span>主观题</span></div>
      <div class="s"><b>3</b><span>高频分级</span></div>
      <div class="s"><b>1840→今</b><span>时间跨度</span></div>
    </div>
  </div>
  <div class="section-title"><span class="bar"></span><h2 class="serif">时间线总览</h2><span class="hint">点击进入对应章节</span></div>
  <div class="ov-rail-wrap">${cards}</div>
  <div class="section-title"><span class="bar"></span><h2 class="serif">中国近现代史大事年表</h2><span class="hint">按年份检索重大事件</span></div>
  <div style="text-align:center;margin-bottom:10px"><button onclick="location.hash='#/timeline'" style="border:1px solid var(--vermilion);background:var(--vermilion);color:#fff;border-radius:100px;padding:9px 24px;font-size:14px;cursor:pointer;font-family:inherit">查看完整大事年表 →</button></div>`;
}

/* 章节视图 */
let curFilter={};
function viewChapter(id){
  const idx=META.findIndex(m=>m.id===id);
  const m=META[idx];const d=DATA[id];
  if(!d)return '<div class="home-hero"><h1>内容整理中</h1></div>';
  const f=curFilter[id]||'all';
  const counts={jg:d.qa.filter(q=>q.lv==='jg').length,gp:d.qa.filter(q=>q.lv==='gp').length,zp:d.qa.filter(q=>q.lv==='zp').length};
  const prev=idx>0?META[idx-1]:null,next=idx<META.length-1?META[idx+1]:null;
  return `
  <div class="ch-head">
    <span class="big">${idx+1}</span>
    <span class="range">${m.range}</span>
    <h1 class="serif">第${'一二三四五六七八九十'[idx]}章 · ${m.title}</h1>
    <div class="lead">${m.lead}</div>
  </div>

  <div class="section-title"><span class="bar"></span><h2 class="serif">一、选择题考点</h2></div>
  ${renderChoice(d.choice)}

  <div class="section-title"><span class="bar"></span><h2 class="serif">二、主观题带背</h2><span class="hint">点击题目展开答案</span></div>
  <div class="filterbar">
    <span class="fl-lbl">频次：</span>
    <button class="${f==='all'?'active':''}" onclick="setFilter('${id}','all')">全部<span class="cnt">${d.qa.length}</span></button>
    <button class="${f==='jg'?'active':''}" onclick="setFilter('${id}','jg')">极高频<span class="cnt">${counts.jg}</span></button>
    <button class="${f==='gp'?'active':''}" onclick="setFilter('${id}','gp')">高频<span class="cnt">${counts.gp}</span></button>
    <button class="${f==='zp'?'active':''}" onclick="setFilter('${id}','zp')">中频<span class="cnt">${counts.zp}</span></button>
  </div>
  <div id="qalist">${renderQA(d.qa,f)}</div>

  <div class="chpager">
    ${prev?`<a href="#/${prev.id}"><div class="k">← 上一章</div><div class="v serif">${prev.title}</div></a>`:'<a class="disabled"></a>'}
    ${next?`<a class="next" href="#/${next.id}"><div class="k">下一章 →</div><div class="v serif">${next.title}</div></a>`:'<a class="disabled"></a>'}
  </div>`;
}
function setFilter(id,f){curFilter[id]=f;document.getElementById('qalist').innerHTML=renderQA(DATA[id].qa,f);
  document.querySelectorAll('.filterbar button').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');bindQA();}

/* 年表视图 */
function viewTimeline(){
  const groups=YEAR_DATA.map(g=>`
    <div class="era-group">
      <span class="era-t serif">${g.era}（${g.range}）</span>
      <table class="tl-table">
        <colgroup><col style="width:18%"><col style="width:82%"></colgroup>
        <thead><tr><th>时间</th><th>事件</th></tr></thead>
        <tbody>${g.rows.map(r=>`<tr><td class="year">${r.y}</td><td>${r.e}</td></tr>`).join('')}</tbody>
      </table>
    </div>`).join('');
  return `<div class="section-title" style="margin-top:10px"><span class="bar"></span><h2 class="serif">中国近现代史大事年表</h2></div>${groups}`;
}

/* 手风琴展开 */
function bindQA(){
  document.querySelectorAll('.qa .q').forEach(q=>{
    q.onclick=()=>q.parentElement.classList.toggle('open');
  });
}

/* 顶部导航 */
function renderNav(hash){
  const t=document.getElementById('navtabs');
  let h=`<button class="homebtn ${hash==='#/'?'active':''}" onclick="location.hash='#/'">首页</button>`;
  h+=META.map((m,i)=>`<button class="${hash==='#/'+m.id?'active':''}" onclick="location.hash='#/${m.id}'">${i+1}</button>`).join('');
  h+=`<button class="${hash==='#/timeline'?'active':''}" onclick="location.hash='#/timeline'">年表</button>`;
  t.innerHTML=h;
}

/* 路由 */
function route(){
  let hash=location.hash||'#/';
  const app=document.getElementById('app');
  if(hash==='#/'||hash===''){app.innerHTML='<div class="view show">'+viewHome()+'</div>';}
  else if(hash==='#/timeline'){app.innerHTML='<div class="view show">'+viewTimeline()+'</div>';}
  else{
    const id=hash.replace('#/','');
    app.innerHTML='<div class="view show">'+viewChapter(id)+'</div>';
  }
  renderNav(hash);
  bindQA();
  window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);
route();
</script>
