let cur='all',order=[],idx=0,right=0,wrong=0,picked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function start(){const pool=cur==='all'?Object.values(QUIZ).flat():QUIZ[cur];order=shuffle(pool.slice());idx=0;right=0;wrong=0;picked=false;render();}
function renderTabs(){const t=document.getElementById('chTabs');let h='';for(const k in CHNAMES){const c=k==='all'?Object.values(QUIZ).flat().length:QUIZ[k].length;h+=`<button class="${k===cur?'active':''}" onclick="setCh('${k}')">${CHNAMES[k]} ${c}</button>`;}t.innerHTML=h;}
function setCh(k){cur=k;renderTabs();start();}
function render(){
  const stage=document.getElementById('stage');
  if(idx>=order.length){stage.innerHTML=renderDone();return;}
  const it=order[idx];
  const opts=it.opts.map((o,oi)=>`<div class="opt" onclick="pick(${oi})"><span class="lt">${'ABCD'[oi]}</span><span>${o}</span></div>`).join('');
  stage.innerHTML=`
    <div class="hud"><span>第 <b>${idx+1}</b> / ${order.length} 题 · ${CHNAMES[cur]}</span><span>答对 <b class="right" id="cR">${right}</b> · 答错 <b class="wrong" id="cW">${wrong}</b></span></div>
    <div class="bar"><i style="width:${(idx/order.length*100).toFixed(1)}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="qnum">第 ${idx+1} 题</span><span class="tag">${CHNAMES[cur]}</span></div>
      <div class="qt serif">${it.q}</div>
      <div class="opts" id="opts">${opts}</div>
      <div class="fb" id="fb"></div>
      <div class="acts" id="acts"></div>
    </div>`;
}
function pick(oi){
  if(picked)return;picked=true;
  const it=order[idx];const ok=oi===it.ans;
  if(ok)right++;else wrong++;
  const ops=document.querySelectorAll('#opts .opt');
  ops.forEach((o,j)=>{o.classList.add('locked');if(j===it.ans)o.classList.add('correct');else if(j===oi)o.classList.add('wrong');});
  const cr=document.getElementById('cR'),cw=document.getElementById('cW');
  if(cr)cr.textContent=right;if(cw)cw.textContent=wrong;
  const fb=document.getElementById('fb');
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'<b>回答正确！</b>':'<b>回答错误</b>')+`　正确答案：<b>${'ABCD'[it.ans]}</b>　${it.opts[it.ans]}`;
  const acts=document.getElementById('acts');
  const last=idx===order.length-1;
  acts.innerHTML=`<button class="btn" onclick="next()">${last?'查看成绩':'下一题'}${last?'':' →'}</button>`;
}
function next(){idx++;picked=false;render();}
function renderDone(){
  const total=order.length;const rate=total?Math.round(right/total*100):0;
  return `<div class="done">
    <div class="score">${right} / ${total}</div>
    <div class="sub">共作答 ${total} 题 · 答对 ${right} 题 · 答错 ${wrong} 题</div>
    <div class="rate">正确率 ${rate}%</div>
    <div style="margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="start()">再练一组（重新打乱）</button>
      <a class="btn ghost" href="index.html">返回主页</a>
    </div></div>`;
}
renderTabs();start();
